        header p { font-size: 14px; opacity: 0.85; }
        .header-icon { width: 64px; height: 64px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; }

        .lang-selector { display: flex; justify-content: center; gap: 8px; margin: 16px 0 0; flex-wrap: wrap; }
        .lang-btn { background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); color: white; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .lang-btn:hover, .lang-btn.active { background: white; color: #534AB7; border-color: white; }

        main { max-width: 720px; margin: -24px auto 40px; padding: 0 16px; }
        .section-title { font-size: 12px; font-weight: 700; color: #534AB7; text-transform: uppercase; letter-spacing: 1px; margin: 28px 0 12px; }
        .faq-card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(83,74,183,0.08); overflow: hidden; margin-bottom: 8px; }
        .faq-question { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; cursor: pointer; font-size: 15px; font-weight: 600; color: #2D2A6E; user-select: none; transition: background 0.2s; }
        .faq-question:hover { background: #F8F7FF; }
        .faq-question .arrow { width: 20px; height: 20px; color: #534AB7; transition: transform 0.3s; flex-shrink: 0; }
        .faq-question.open .arrow { transform: rotate(180deg); }
        .faq-answer { display: none; padding: 0 20px 18px; font-size: 14px; color: #555; line-height: 1.7; border-top: 1px solid #F0EFF8; }
        .faq-answer img { display: block; max-width: 100%; border-radius: 12px; margin: 12px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .faq-answer ul { margin: 8px 0 0 16px; }
        .form-card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(83,74,183,0.08); padding: 24px 20px; margin-bottom: 8px; }
        .form-card h3 { font-size: 16px; color: #2D2A6E; margin-bottom: 6px; }
        .form-card p { font-size: 13px; color: #888; margin-bottom: 16px; }
        .form-card iframe { width: 100%; border: none; border-radius: 8px; height: 520px; }
        footer { text-align: center; padding: 24px; font-size: 12px; color: #999; }
        .badge { display: inline-block; background: #EEF0FF; color: #534AB7; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 20px; margin-bottom: 4px; }

function setLang(lang) {
    const t = translations[lang];
    document.getElementById('header-title').textContent = t.headerTitle;
    document.getElementById('header-sub').textContent = t.headerSub;
    document.getElementById('footer-text').textContent = t.footer;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[onclick="setLang('${lang}')"]`).classList.add('active');

    const main = document.getElementById('main-content');
    main.innerHTML = `
        <div class="section-title">${t.faqTitle}</div>
        ${t.faqs.map(f => `
        <div class="faq-card">
            <div class="faq-question">
                ${f.q}
                <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="faq-answer">${f.a}</div>
        </div>`).join('')}
        <div class="section-title">${t.contactTitle}</div>
        <div class="form-card">
            <h3>${t.contactHead}</h3>
            <p>${t.contactSub}</p>
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd_H3ArxDQkkCSdhRPyDRU8dgfE5uEbh4rc0TwUMD7yg-D_CQ/viewform?embedded=true" title="Formulario">Cargando…</iframe>
        </div>
    `;

    // RTL para árabe
    document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';

    // Eventos acordeón
    document.querySelectorAll('.faq-question').forEach(q => {
        q.addEventListener('click', () => {
            const answer = q.nextElementSibling;
            const isOpen = answer.style.display === 'block';
            document.querySelectorAll('.faq-answer').forEach(a => a.style.display = 'none');
            document.querySelectorAll('.faq-question').forEach(q2 => q2.classList.remove('open'));
            if (!isOpen) { answer.style.display = 'block'; q.classList.add('open'); }
        });
    });

    localStorage.setItem('fl_lang', lang);
}

// Detectar idioma guardado o del navegador
const saved = localStorage.getItem('fl_lang');
const browserLang = navigator.language.substring(0, 2);
const defaultLang = saved || (['es','en','fr','pt','zh','ar'].includes(browserLang) ? browserLang : 'es');
setLang(defaultLang);
</script>
